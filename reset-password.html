<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose a new password | Les Braid It Members</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400;1,600&family=Montserrat:wght@400;500;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <a href="index.html"><img src="assets/images/membership-logo.png" alt="Les Braid It Members" class="logo"></a>
    <nav class="main-nav">
      <button class="nav-toggle" type="button" aria-label="Toggle menu" aria-expanded="false"><span></span><span></span><span></span></button>
      <ul>
        <li><a href="booking.html"><img src="assets/images/icons/nav-book-now.png" alt="">Book now</a></li>
        <li><a href="index.html"><img src="assets/images/icons/nav-home.png" alt="">Home</a></li>
        <li><a href="portfolio.html"><img src="assets/images/icons/nav-portfolio.png" alt="">Portfolio</a></li>
        <li><a href="policies.html"><img src="assets/images/icons/nav-policies.png" alt="">Policies</a></li>
        <li><a href="contact.html"><img src="assets/images/icons/nav-contact.png" alt="">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main class="member-page">
    <section class="member-intro">
      <p class="hero-eyebrow">Les Braid It Members</p>
      <h1>New password</h1>
      <p>Choose a new password for your account.</p>
    </section>

    <section class="member-card" aria-label="Choose a new password">
      <p class="member-status" role="status" aria-live="polite" hidden></p>
      <form class="member-form" id="reset-form" novalidate>
        <div class="field">
          <label for="reset-password">New password</label>
          <div class="password-field">
            <input type="password" id="reset-password" name="password" autocomplete="new-password" placeholder="At least 8 characters" minlength="8" required>
            <button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false">Show</button>
          </div>
        </div>
        <div class="field">
          <label for="reset-confirm">Confirm new password</label>
          <input type="password" id="reset-confirm" name="confirm" autocomplete="new-password" placeholder="Type it again" required>
        </div>
        <button class="submit-btn" type="submit">Update password</button>
      </form>
    </section>
  </main>

  <footer class="site-footer"><p>&copy; 2026 Les Braid It. All rights reserved.</p></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="assets/js/supabase-config.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/member.js"></script>
</body>
</html>
